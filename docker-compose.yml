services:
  skillhub:
    build: .
    volumes:
      - skillhub-data:/data/db
      - skillhub-skills:/data/skills
      - ~/.skillhub/config.yaml:/home/appuser/.skillhub/config.yaml:ro
    environment:
      - SKILLHUB_HOST=0.0.0.0
      - SKILLHUB_SECRET_KEY=${SKILLHUB_SECRET_KEY:-}
    ports:
      - "${SKILLHUB_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  skillhub-data:
  skillhub-skills:
